<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzzy</title>
<link rel="icon" type="image/png" href="Fuzzy.png">
<style>
  :root {
    --blob-scale: 1.0; /* Adjusted automatically via BLOB_SIZE_SCALE in JS */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#fff;overflow-x:hidden;position:relative;min-height:100vh;
    background:#0a1128;
    --ease:cubic-bezier(.22,1,.36,1);
    --pop:cubic-bezier(.34,1.56,.64,1);
  }

  /* liquid cloud background (lighter black + lighter dark blue) */
  #liquid{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,#101c44,#070d20 75%)}
  .blob{position:absolute;filter:blur(70px);opacity:.85;will-change:transform,border-radius;
    border-radius:42% 58% 63% 37% / 45% 40% 60% 55%}
  .l1{width:calc(60vmax * var(--blob-scale));height:calc(60vmax * var(--blob-scale));background:#2b5cff;top:-15vmax;left:-12vmax;animation:flow1 22s ease-in-out infinite,morph 14s ease-in-out infinite}
  .l2{width:calc(50vmax * var(--blob-scale));height:calc(50vmax * var(--blob-scale));background:#8ae0ff;bottom:-18vmax;right:-10vmax;opacity:.7;animation:flow2 26s ease-in-out infinite,morph 17s ease-in-out infinite reverse}
  .l3{width:calc(40vmax * var(--blob-scale));height:calc(40vmax * var(--blob-scale));background:#1f4fd0;top:30%;left:35%;animation:flow3 30s ease-in-out infinite,morph 19s ease-in-out infinite}
  .l4{width:calc(32vmax * var(--blob-scale));height:calc(32vmax * var(--blob-scale));background:#4db2ff;top:-8vmax;right:5vmax;opacity:.6;animation:flow4 24s ease-in-out infinite,morph 15s ease-in-out infinite reverse}
  .l5{width:calc(36vmax * var(--blob-scale));height:calc(36vmax * var(--blob-scale));background:#1c2540;bottom:5vmax;left:-8vmax;opacity:.95;animation:flow5 28s ease-in-out infinite,morph 21s ease-in-out infinite}
  .l6{width:calc(26vmax * var(--blob-scale));height:calc(26vmax * var(--blob-scale));background:#b8ecff;top:45%;right:20%;opacity:.45;animation:flow6 20s ease-in-out infinite,morph 13s ease-in-out infinite reverse}
  @keyframes morph{
    0%,100%{border-radius:42% 58% 63% 37% / 45% 40% 60% 55%}
    25%{border-radius:60% 40% 45% 55% / 55% 60% 40% 45%}
    50%{border-radius:38% 62% 55% 45% / 62% 38% 62% 38%}
    75%{border-radius:55% 45% 38% 62% / 40% 55% 45% 60%}
  }
  @keyframes flow1{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(30vw,20vh) rotate(60deg)}66%{transform:translate(10vw,45vh) rotate(130deg)}}
  @keyframes flow2{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(-35vw,-20vh) rotate(-70deg)}66%{transform:translate(-15vw,-40vh) rotate(-140deg)}}
  @keyframes flow3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30vw,15vh) scale(1.3)}}
  @keyframes flow4{0%,100%{transform:translate(0,0)}50%{transform:translate(-25vw,35vh) scale(1.2)}}
  @keyframes flow5{0%,100%{transform:translate(0,0)}50%{transform:translate(40vw,-25vh) scale(1.25)}}
  @keyframes flow6{0%,100%{transform:translate(0,0)}50%{transform:translate(-30vw,-30vh) scale(1.4)}}

  /* falling twinkling stars */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .star{position:absolute;top:-10px;border-radius:50%;opacity:0;animation:fall linear infinite}
  @keyframes fall{
    0%{transform:translate(0,0);opacity:0}
    10%{opacity:.9}
    50%{opacity:.4}
    70%{opacity:.9}
    100%{transform:translate(var(--dx),110vh);opacity:0}
  }
  .shoot{position:fixed;width:90px;height:2px;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,transparent,#fff);opacity:0}

  /* shared animations */
  @keyframes pop{from{scale:.05;opacity:0}to{scale:1;opacity:1}}
  @keyframes wobble{0%,100%{translate:0 0;rotate:0deg}50%{translate:0 -6px;rotate:-1.5deg}}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
  @keyframes slidedown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}

  /* white glow under logo + mascot (weaker & softer) */
  .glowwrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
  .glowwrap::before{content:"";position:absolute;inset:-4%;border-radius:50%;z-index:0;
    background:radial-gradient(circle,rgba(255,255,255,.22) 0%,rgba(255,255,255,.1) 40%,rgba(255,255,255,0) 65%);
    filter:blur(4px);animation:glowpulse 3s ease-in-out infinite}
  .glowwrap img{position:relative;z-index:1;display:block}
  @keyframes glowpulse{0%,100%{opacity:.3;scale:.95}50%{opacity:.5;scale:1.02}}

  header{position:relative;z-index:3;display:flex;align-items:center;padding:20px 32px;animation:slidedown .8s ease both}
  .brand{display:flex;align-items:center;gap:18px}
  #logoWrap{width:84px;height:84px;--d:.1s;
    animation:pop .9s var(--pop) var(--d) backwards,bob 4s ease-in-out 1s infinite}
  #logoWrap img{width:84px;height:84px;object-fit:contain;border-radius:20px;cursor:pointer;user-select:none;
    transition:transform .4s var(--ease)}
  #logoWrap img:hover{transform:scale(1.12) rotate(-6deg)}
  #logoWrap img:active{transform:scale(.94)}
  .brand span{font-size:44px;font-weight:900;letter-spacing:2px;text-shadow:0 0 20px rgba(138,224,255,.5)}

  .hero{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    gap:40px;padding:20px 8vw 100px;min-height:calc(100vh - 130px);flex-wrap:wrap}
  .text{max-width:640px}
  h1{display:inline-block;font-size:clamp(40px,8vw,84px);line-height:.95;font-weight:900;text-transform:uppercase;
    letter-spacing:-1px;margin-bottom:28px;min-height:2em;animation:wobble 3s ease-in-out infinite}
  h1::after{content:"|";margin-left:4px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .desc{font-size:clamp(20px,2.6vw,28px);line-height:1.4;font-weight:800;color:#eaf6ff;margin-bottom:12px}
  .fun{font-size:18px;font-weight:600;color:#a9e2ff;margin-bottom:36px;min-height:26px;transition:opacity .4s}
  .btns{display:flex;gap:14px;flex-wrap:wrap}

  .btn{position:relative;overflow:hidden;display:inline-block;padding:17px 34px;font-size:19px;font-weight:700;
    border-radius:14px;text-decoration:none;cursor:pointer;font-family:inherit;border:2px solid #fff;
    animation:pop .9s var(--pop) var(--d) backwards,wobble 3.5s ease-in-out calc(var(--d) + .9s) infinite;
    transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .4s var(--ease),color .4s var(--ease)}
  .btn.main{--d:.45s;color:#0a1128;background:#fff}
  .btn.share{--d:.6s;color:#fff;background:rgba(255,255,255,.1);backdrop-filter:blur(6px)}
  .btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(138,224,255,.65),transparent);transition:left .7s var(--ease)}
  .btn:hover{transform:translateY(-5px) scale(1.07);box-shadow:0 14px 32px rgba(138,224,255,.5)}
  .btn:hover::after{left:140%}
  .btn.share:hover{background:#fff;color:#0a1128}
  .btn:active{transform:translateY(0) scale(.95);transition-duration:.12s}

  .qrwrap{flex:1;display:flex;justify-content:center;min-width:260px}
  .qr{width:min(340px,70vw);padding:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,.4);border-radius:28px;
    box-shadow:0 10px 50px rgba(43,92,255,.45);
    animation:pop 1s var(--pop) .75s backwards,qrfloat 5s ease-in-out 1.75s infinite}
  .qr img{width:100%;display:block;border-radius:16px}
  @keyframes qrfloat{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -22px;rotate:2deg}}

  /* mascot */
  #mascot{position:fixed;left:20px;bottom:20px;z-index:20;display:flex;align-items:flex-end;gap:12px}
  #mascotWrap{width:70px;height:70px;--d:1.05s;
    animation:pop .9s var(--pop) var(--d) backwards,bob 3.2s ease-in-out 2s infinite}
  #mascotWrap img{width:70px;height:70px;object-fit:contain;cursor:pointer;user-select:none;
    transition:transform .4s var(--ease)}
  #mascotWrap img:hover{transform:scale(1.15) rotate(6deg)}
  #mascotWrap img:active{transform:scale(.92)}
  #bubble{background:#fff;color:#0a1128;font-weight:700;font-size:15px;padding:10px 14px;border-radius:14px;
    box-shadow:0 4px 16px rgba(138,224,255,.4);margin-bottom:10px;
    opacity:0;transform:translateY(8px) scale(.9);transition:.4s var(--ease);pointer-events:none;max-width:220px}
  #bubble.show{opacity:1;transform:none;animation:bubble-pop .4s var(--pop)}
  @keyframes bubble-pop{0%{transform:translateY(12px) scale(.7);opacity:0}70%{transform:translateY(-2px) scale(1.05)}100%{transform:none;opacity:1}}

  /* music button */
  #music{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;align-items:center;gap:12px;
    padding:12px 22px 12px 16px;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px;
    background:linear-gradient(135deg,rgba(43,92,255,.75),rgba(138,224,255,.45));
    border:1.5px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);
    box-shadow:0 6px 24px rgba(43,92,255,.5),inset 0 1px 0 rgba(255,255,255,.4);
    animation:pop .9s var(--pop) 1.25s backwards,bob 3.6s ease-in-out 2.2s infinite;
    transition:transform .4s var(--ease),box-shadow .4s var(--ease),background .4s var(--ease)}
  #music:hover{transform:translateY(-4px) scale(1.07);box-shadow:0 12px 34px rgba(138,224,255,.65),inset 0 1px 0 rgba(255,255,255,.5)}
  #music:active{transform:scale(.94);transition-duration:.12s}
  #music.off{background:linear-gradient(135deg,rgba(28,37,64,.8),rgba(60,80,130,.5));box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .eq{display:flex;align-items:flex-end;gap:3px;height:20px;width:22px}
  .eq i{flex:1;background:#fff;border-radius:2px;height:100%;transform-origin:bottom;
    animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(1){animation-delay:-.2s}
  .eq i:nth-child(2){animation-delay:-.6s}
  .eq i:nth-child(3){animation-delay:-.4s}
  .eq i:nth-child(4){animation-delay:-.8s}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  #music.off .eq i{animation-play-state:paused;transform:scaleY(.2);opacity:.6}

  .conf{position:fixed;top:-20px;z-index:100;pointer-events:none}
  .party-emoji{position:fixed;z-index:101;pointer-events:none;font-size:28px;user-select:none}
  .party-banner{position:fixed;top:15%;left:50%;transform:translate(-50%,-50%) scale(0);
    z-index:150;background:rgba(255,255,255,.95);color:#0a1128;font-size:clamp(22px,5vw,42px);
    font-weight:900;padding:16px 36px;border-radius:99px;box-shadow:0 10px 50px rgba(138,224,255,.8);
    pointer-events:none;text-align:center;letter-spacing:1px}

  .big-wobble{animation:bigwobble 1.2s ease}
  @keyframes bigwobble{20%{transform:rotate(-6deg) scale(1.05)}40%{transform:rotate(6deg) scale(.95)}
    60%{transform:rotate(-4deg) scale(1.02)}80%{transform:rotate(3deg)}}

  /* Mobile Responsive Adjustments */
  @media (max-width: 768px) {
    header { padding: 16px 20px; justify-content: center; }
    .brand { gap: 12px; }
    #logoWrap, #logoWrap img { width: 60px; height: 60px; border-radius: 14px; }
    .brand span { font-size: 32px; }

    .hero {
      flex-direction: column;
      text-align: center;
      padding: 10px 20px 140px;
      gap: 32px;
      justify-content: center;
      min-height: auto;
    }
    .text { max-width: 100%; }
    .btns { justify-content: center; width: 100%; }
    .btn { width: 100%; text-align: center; padding: 14px 24px; font-size: 17px; }

    .qrwrap { min-width: unset; width: 100%; }
    .qr { width: min(260px, 80vw); padding: 14px; margin: 0 auto; }

    #mascot { left: 12px; bottom: 12px; gap: 8px; }
    #mascotWrap, #mascotWrap img { width: 52px; height: 52px; }
    #bubble { font-size: 13px; padding: 8px 12px; max-width: 160px; margin-bottom: 6px; }

    #music { right: 12px; bottom: 12px; padding: 10px 16px 10px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="liquid">
  <div class="blob l1"></div><div class="blob l2"></div><div class="blob l3"></div>
  <div class="blob l4"></div><div class="blob l5"></div><div class="blob l6"></div>
</div>
<div id="stars"></div>

<header>
  <div class="brand">
    <div class="glowwrap" id="logoWrap">
      <img id="logo" src="Fuzzy.png" alt="Fuzzy logo" onerror="this.parentNode.style.display='none'">
    </div>
    <span>FUZZY</span>
  </div>
</header>

<section class="hero">
  <div class="text">
    <h1 id="title"></h1>
    <p class="desc">Fuzzy is cool and shii, woohooo :OO</p>
    <p class="fun" id="fun">woohooo :OO</p>
    <div class="btns">
      <a class="btn main" href="https://fuzzedd.github.io/Fuzzy" target="_blank" rel="noopener noreferrer">Open Fuzzy</a>
      <button class="btn share" id="share">Copy link</button>
    </div>
  </div>
  <div class="qrwrap">
    <div class="qr"><img src="fuzzyQR.png" alt="Fuzzy QR code" onerror="this.parentNode.style.display='none'"></div>
  </div>
</section>

<div id="mascot">
  <div class="glowwrap" id="mascotWrap">
    <img id="mascotImg" src="Fuzzy.png" alt="Fuzzy mascot" onerror="this.parentNode.style.display='none'">
  </div>
  <div id="bubble"></div>
</div>

<button id="music">
  <span class="eq"><i></i><i></i><i></i><i></i></span>
  <span id="mlabel">Music on</span>
</button>

<audio id="audio" src="melody.mp3" loop autoplay></audio>

<!-- SLITHER.IO GAME MODAL -->
<div id="gameModal" style="display:none; position:fixed; inset:0; z-index:1000; background:rgba(10,17,40,0.95); backdrop-filter:blur(12px); flex-direction:column; align-items:center; justify-content:center;">
  <div style="position:relative; width:90%; max-width:600px; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.3); border-radius:24px; padding:20px; display:flex; flex-direction:column; align-items:center; box-shadow:0 20px 50px rgba(43,92,255,0.5);">
    <div style="display:flex; justify-content:space-between; width:100%; align-items:center; margin-bottom:15px;">
      <h2 style="font-size:24px; font-weight:900; color:#8ae0ff;">🐍 Fuzzy Slither</h2>
      <button id="closeGame" style="background:#ff5c5c; color:#fff; border:none; width:36px; height:36px; border-radius:50%; font-size:18px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(255,92,92,0.4);">✕</button>
    </div>
    <div style="font-size:16px; font-weight:700; margin-bottom:10px;">Score: <span id="gameScore">0</span></div>
    <canvas id="gameCanvas" width="540" height="360" style="background:#070d20; border-radius:16px; border:2px solid rgba(255,255,255,0.2); cursor:crosshair; width:100%; max-width:540px; height:auto;"></canvas>
    <p style="font-size:13px; color:#a9e2ff; margin-top:10px; text-align:center;">Move mouse or touch to steer your fuzzy snake and eat food!</p>
  </div>
</div>

<script>
  /* ========================================================= */
  /* SETTING: BACKGROUND BLOB SIZE SCALE                        */
  /* Change this value to adjust liquid background blob sizes   */
  /* Example: 0.5 = 50% size | 1.0 = normal | 1.5 = 150% size  */
  /* ========================================================= */
  const BLOB_SIZE_SCALE = 1.0;
  document.documentElement.style.setProperty("--blob-scale", BLOB_SIZE_SCALE);

  const SITE = "https://fuzzedd.github.io/Fuzzy";
  const byId = id => document.getElementById(id);

  /* Sound debouncer so clicka.mp3 plays only once per tap */
  let lastClickTime = 0;
  function playClickSound() {
    const now = Date.now();
    if (now - lastClickTime < 100) return;
    lastClickTime = now;
    const snd = new Audio("clicka.mp3");
    snd.play().catch(() => {});
  }

  /* tiny falling stars */
  const stars = byId("stars");
  const starCols = ["#ffffff", "#8ae0ff", "#b8ecff", "#4db2ff"];
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = (1 + Math.random() * 2) * 1.4;
    s.style.width = s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.background = starCols[i % starCols.length];
    s.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
    s.style.animationDuration = (5 + Math.random() * 8) + "s";
    s.style.animationDelay = (-Math.random() * 13) + "s";
    stars.appendChild(s);
  }

  /* shooting stars */
  function shoot() {
    const s = document.createElement("div");
    s.className = "shoot";
    s.style.top = (Math.random() * 40) + "%";
    s.style.left = (30 + Math.random() * 60) + "%";
    document.body.appendChild(s);
    s.animate([
      {opacity: 1, transform: "rotate(25deg) translate(0,0)"},
      {opacity: 0, transform: "rotate(25deg) translate(-400px,0)"}
    ], {duration: 1000, easing: "ease-out"}).onfinish = () => s.remove();
    setTimeout(shoot, 5000 + Math.random() * 7000);
  }
  setTimeout(shoot, 2500);

  /* typing headline */
  const full = "Welcome to\nFuzzy";
  let ti = 0;
  setTimeout(function type() {
    byId("title").innerHTML = full.slice(0, ti).replace("\n", "<br>");
    if (ti++ < full.length) setTimeout(type, 110);
  }, 300);

  /* rotating fun line */
  const lines = ["woohooo :OO", "no cap, it's cool", "you found the fuzzy zone", "stay fuzzy", "certified shii", "fuzzy mode: ON"];
  let li = 0;
  setInterval(() => {
    const f = byId("fun");
    f.style.opacity = 0;
    setTimeout(() => { li = (li + 1) % lines.length; f.textContent = lines[li]; f.style.opacity = 1; }, 400);
  }, 3000);

  /* easter egg: 5 clicks for party, 10 clicks under 5 seconds for Slither game */
  let logoClicks = 0, logoTimer = null, partyClicks = 0, partyTimer = null;
  byId("logo").addEventListener("click", () => {
    // Party counter (5 clicks)
    partyClicks++;
    clearTimeout(partyTimer);
    partyTimer = setTimeout(() => partyClicks = 0, 1500);
    if (partyClicks >= 5) { partyClicks = 0; party(); }

    // Slither Game counter (10 clicks under 5 seconds)
    logoClicks++;
    if (logoClicks === 1) {
      logoTimer = setTimeout(() => logoClicks = 0, 5000);
    }
    if (logoClicks >= 10) {
      clearTimeout(logoTimer);
      logoClicks = 0;
      openSlitherGame();
    }
  });

  function party() {
    const yaySound = new Audio("yayy.mp3");
    yaySound.play().catch(() => {});

    document.body.classList.add("big-wobble");
    setTimeout(() => document.body.classList.remove("big-wobble"), 1200);

    const banner = document.createElement("div");
    banner.className = "party-banner";
    banner.textContent = "🎉 YAYY! FUZZY PARTY! 🎉";
    document.body.appendChild(banner);
    banner.animate([
      {transform: "translate(-50%,-50%) scale(0)", opacity: 0},
      {transform: "translate(-50%,-50%) scale(1.1)", opacity: 1, offset: 0.2},
      {transform: "translate(-50%,-50%) scale(1)", opacity: 1, offset: 0.8},
      {transform: "translate(-50%,-50%) scale(0.5)", opacity: 0}
    ], {duration: 2500, easing: "ease-out"}).onfinish = () => banner.remove();

    const cols = ["#2b5cff", "#8ae0ff", "#ffffff", "#4db2ff", "#b8ecff", "#ffdd57", "#ff6b6b", "#a064ff"];
    for (let i = 0; i < 220; i++) {
      const c = document.createElement("div");
      c.className = "conf";
      const size = Math.random() * 12 + 6;
      c.style.width = size + "px";
      c.style.height = (Math.random() > 0.4 ? size : size * 2) + "px";
      c.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = cols[i % cols.length];
      document.body.appendChild(c);
      
      const duration = 1800 + Math.random() * 2200;
      const xVel = (Math.random() - 0.5) * 300;
      c.animate([
        {transform: "translateY(0) translateX(0) rotate(0deg)", opacity: 1},
        {transform: `translateY(105vh) translateX(${xVel}px) rotate(${Math.random() * 1080}deg)`, opacity: 0.9}
      ], {duration: duration, easing: "cubic-bezier(.25,1,.5,1)"}).onfinish = () => c.remove();
    }

    const emojis = ["✨", "🎉", "🌟", "🥳", "💙", "⭐", "🎈"];
    for (let i = 0; i < 35; i++) {
      const e = document.createElement("div");
      e.className = "party-emoji";
      e.textContent = emojis[i % emojis.length];
      e.style.left = Math.random() * 90 + 5 + "vw";
      e.style.top = Math.random() * 40 + 30 + "vh";
      document.body.appendChild(e);

      const dx = (Math.random() - 0.5) * 200;
      const dy = -100 - Math.random() * 200;
      e.animate([
        {transform: "scale(0) translate(0,0)", opacity: 0},
        {transform: "scale(1.4) translate(0,-20px)", opacity: 1, offset: 0.3},
        {transform: `scale(1) translate(${dx}px, ${dy}px)`, opacity: 0}
      ], {duration: 2000 + Math.random() * 1000, easing: "ease-out"}).onfinish = () => e.remove();
    }
  }

  /* SLITHER.IO GAME LOGIC */
  let gameActive = false;
  let animationFrameId = null;
  let snake, food, score, mouseX, mouseY;
  const canvas = byId("gameCanvas");
  const ctx = canvas.getContext("2d");

  function openSlitherGame() {
    playClickSound();
    byId("gameModal").style.display = "flex";
    gameActive = true;
    initGame();
    runGame();
  }

  byId("closeGame").addEventListener("click", () => {
    playClickSound();
    byId("gameModal").style.display = "none";
    gameActive = false;
    cancelAnimationFrame(animationFrameId);
  });

  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });

  canvas.addEventListener("touchmove", e => {
    const rect = canvas.getBoundingClientRect();
    if (e.touches.length > 0) {
      mouseX = e.touches[0].clientX - rect.left;
      mouseY = e.touches[0].clientY - rect.top;
    }
  });

  function initGame() {
    snake = [
      {x: 270, y: 180},
      {x: 255, y: 180},
      {x: 240, y: 180}
    ];
    score = 0;
    byId("gameScore").textContent = score;
    mouseX = canvas.width / 2 + 50;
    mouseY = canvas.height / 2;
    spawnFood();
  }

  function spawnFood() {
    food = {
      x: Math.random() * (canvas.width - 40) + 20,
      y: Math.random() * (canvas.height - 40) + 20,
      color: ["#8ae0ff", "#4db2ff", "#b8ecff", "#2b5cff"][Math.floor(Math.random() * 4)]
    };
  }

  function runGame() {
    if (!gameActive) return;

    const head = snake[0];
    const angle = Math.atan2(mouseY - head.y, mouseX - head.x);
    const speed = 2.5;
    const newX = head.x + Math.cos(angle) * speed;
    const newY = head.y + Math.sin(angle) * speed;

    const wrappedX = (newX + canvas.width) % canvas.width;
    const wrappedY = (newY + canvas.height) % canvas.height;
    const newHead = {x: wrappedX, y: wrappedY};

    const dist = Math.hypot(newHead.x - food.x, newHead.y - food.y);
    if (dist < 15) {
      score += 10;
      byId("gameScore").textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }

    snake.unshift(newHead);

    ctx.fillStyle = "#070d20";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.arc(food.x, food.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = food.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = food.color;
    ctx.fill();
    ctx.shadowBlur = 0;

    for (let i = 0; i < snake.length; i++) {
      const part = snake[i];
      ctx.beginPath();
      ctx.arc(part.x, part.y, i === 0 ? 9 : 7, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? "#ffffff" : "#2b5cff";
      ctx.shadowBlur = i === 0 ? 12 : 5;
      ctx.shadowColor = "#8ae0ff";
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    animationFrameId = requestAnimationFrame(runGame);
  }

  /* mascot: blinks, click for sequential messages */
  const says = [
    "hi hi!", "woohooo :OO", "you clicked me!", "fuzzy is cool and shii", "stay fuzzy", "boop!",
    "ayo what's up", "sheesh, you found me", "i'm just a lil fuzzy guy", "click me again, i dare you",
    "fuzzy gang rise up", "no thoughts, just fuzz", "you look great today", "did you hear the melody?",
    "this site is lowkey fire", "psst... click the logo 5 times", "i live here now", "certified fuzzy moment",
    "go on, hit that Open Fuzzy button", "stay hydrated, fuzzy friend", "bro really clicked a mascot",
    "it's fuzzy o'clock", "vibes: immaculate", "i'm not a bug, i'm a feature", "woah, easy there",
    "fuzzy level: over 9000", "tell your friends about fuzzy", "you're my favourite visitor", "ok that's enough clicking... jk keep going",
    "zoom zoom, fuzzy boom", "today is a good day to be fuzzy"
  ];
  function squish() {
    byId("mascotImg").animate([
      {transform: "scale(1,1)"},
      {transform: "scale(1.15,.8)", offset: .35},
      {transform: "scale(.92,1.12)", offset: .65},
      {transform: "scale(1,1)"}
    ], {duration: 500, easing: "ease-out"});
  }
  setInterval(squish, 4000);
  let bubbleTimer, sayIndex = 0;
  byId("mascotImg").addEventListener("click", () => {
    squish();
    const b = byId("bubble");
    b.classList.remove("show");
    void b.offsetWidth;
    b.textContent = says[sayIndex];
    sayIndex = (sayIndex + 1) % says.length;
    b.classList.add("show");
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => b.classList.remove("show"), 2400);
  });

  /* copy link */
  byId("share").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(SITE); }
    catch (e) {
      const t = document.createElement("textarea");
      t.value = SITE; document.body.appendChild(t); t.select();
      document.execCommand("copy"); t.remove();
    }
    byId("share").textContent = "Copied! 🎉";
    setTimeout(() => byId("share").textContent = "Copy link", 1800);
  });

  /* music: looped, tries to play right when the page loads */
  const audio = byId("audio");
  audio.loop = true;
  audio.volume = 0.4;
  let userStopped = false;
  function setLabel() {
    byId("mlabel").textContent = audio.paused ? "Music off" : "Music on";
    byId("music").classList.toggle("off", audio.paused);
  }
  audio.addEventListener("play", setLabel);
  audio.addEventListener("pause", setLabel);

  audio.play().catch(() => { setLabel(); });

  const kick = () => {
    if (userStopped) return;
    audio.play().then(() => {
      ["pointerdown", "keydown", "touchstart", "click"].forEach(ev => document.removeEventListener(ev, kick));
    }).catch(() => {});
  };
  ["pointerdown", "keydown", "touchstart", "click"].forEach(ev => document.addEventListener(ev, kick));

  byId("music").addEventListener("click", e => {
    e.stopPropagation();
    if (audio.paused) { userStopped = false; audio.play().catch(() => {}); }
    else { userStopped = true; audio.pause(); }
  });

  /* Attach clicka.mp3 sound to ALL interactive elements */
  const interactiveElements = document.querySelectorAll("button, a, .btn, #logo, #mascotImg, #logoWrap, #mascotWrap");
  interactiveElements.forEach(el => {
    el.addEventListener("pointerdown", playClickSound);
  });
</script>
</body>
</html>
