<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzzy</title>
<link rel="icon" type="image/png" href="Fuzzy.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#fff;overflow-x:hidden;position:relative;
    min-height:100vh;
    background:linear-gradient(135deg,#12041f,#2b0a52,#4a1a8c,#1d2f7a,#5a1a6e,#12041f);
    background-size:400% 400%;animation:bgshift 18s ease infinite;
  }
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* glowing blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;z-index:0}
  .b1{width:420px;height:420px;background:#ff4fd8;top:-100px;left:-80px;animation:drift1 14s ease-in-out infinite}
  .b2{width:480px;height:480px;background:#2fe0d0;bottom:-140px;right:-100px;animation:drift2 17s ease-in-out infinite}
  .b3{width:320px;height:320px;background:#6a5cff;top:40%;left:45%;animation:drift3 20s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(160px,120px) scale(1.2)}}
  @keyframes drift2{50%{transform:translate(-180px,-100px) scale(1.15)}}
  @keyframes drift3{50%{transform:translate(-120px,90px) scale(.8)}}

  /* floating dots */
  #dots{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .dot{position:absolute;bottom:-20px;border-radius:50%;opacity:0;animation:floatup linear infinite}
  @keyframes floatup{
    0%{transform:translate(0,0);opacity:0}
    10%{opacity:.9}
    90%{opacity:.9}
    100%{transform:translate(var(--dx),-110vh);opacity:0}
  }

  header{position:relative;z-index:3;display:flex;align-items:center;padding:20px 32px}
  .brand{display:flex;align-items:center;gap:16px;animation:slidedown .8s ease both}
  .brand img{
    width:84px;height:84px;object-fit:contain;border-radius:20px;
    filter:drop-shadow(0 0 14px rgba(255,120,230,.7));
    animation:logofloat 4s ease-in-out infinite,glowpulse 3s ease-in-out infinite;
    transition:transform .5s cubic-bezier(.2,1.6,.4,1);cursor:pointer
  }
  .brand img:hover{transform:rotate(360deg) scale(1.2)}
  .brand span{font-size:44px;font-weight:900;letter-spacing:2px;text-shadow:0 0 18px rgba(255,255,255,.35)}
  @keyframes logofloat{0%,100%{translate:0 0}50%{translate:0 -8px}}
  @keyframes glowpulse{
    0%,100%{filter:drop-shadow(0 0 10px rgba(255,120,230,.6))}
    50%{filter:drop-shadow(0 0 26px rgba(109,247,228,.9))}
  }
  @keyframes slidedown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}

  .hero{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    gap:40px;padding:20px 8vw 80px;min-height:calc(100vh - 120px);flex-wrap:wrap}
  .text{max-width:620px}
  h1{font-size:clamp(40px,8vw,84px);line-height:.95;font-weight:900;text-transform:uppercase;
    letter-spacing:-1px;margin-bottom:28px;color:#fff;animation:rise .9s .15s ease both}
  h1 span{display:inline-block;animation:wobble 3s ease-in-out infinite}
  @keyframes wobble{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.5deg)}}
  p{font-size:clamp(20px,2.6vw,28px);line-height:1.4;font-weight:800;color:#f3e8ff;margin-bottom:40px;
    animation:rise .9s .35s ease both}
  .btn{display:inline-block;padding:18px 36px;font-size:20px;font-weight:700;color:#2b0a52;background:#fff;
    border-radius:14px;text-decoration:none;position:relative;overflow:hidden;
    box-shadow:0 8px 30px rgba(255,123,229,.4);animation:rise .9s .55s ease both,btnpulse 2.5s 1.5s ease-in-out infinite;
    transition:transform .2s,box-shadow .2s}
  .btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,150,230,.5),transparent);transition:left .6s}
  .btn:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 14px 40px rgba(109,247,228,.55)}
  .btn:hover::after{left:140%}
  @keyframes btnpulse{50%{box-shadow:0 8px 44px rgba(255,123,229,.8)}}
  @keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

  /* QR */
  .qrwrap{flex:1;display:flex;justify-content:center;min-width:260px;animation:pop 1s .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
  .qr{width:min(340px,70vw);padding:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);
    border:2px solid rgba(255,255,255,.35);border-radius:28px;cursor:pointer;
    animation:qrfloat 5s ease-in-out infinite;
    transition:transform .4s cubic-bezier(.2,1.5,.4,1),box-shadow .4s,border-color .4s}
  .qr img{width:100%;display:block;border-radius:16px}
  .qr:hover{transform:scale(1.1) rotate(4deg);border-color:#6df7e4;
    box-shadow:0 0 50px rgba(109,247,228,.7),0 0 100px rgba(255,123,229,.5);animation-play-state:paused}
  @keyframes qrfloat{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -22px;rotate:2deg}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="dots"></div>

<header>
  <div class="brand">
    <img src="Fuzzy.png" alt="Fuzzy logo" onerror="this.style.display='none'">
    <span>FUZZY</span>
  </div>
</header>

<section class="hero">
  <div class="text">
    <h1><span>Welcome to</span><br><span style="animation-delay:.3s">Fuzzy</span></h1>
    <p>Fuzzy is cool and shii, woohooo :OO</p>
    <a class="btn" href="https://fuzzedd.github.io/Fuzzy">Open Fuzzy</a>
  </div>
  <div class="qrwrap">
    <div class="qr"><img src="fuzzyQR.png" alt="Fuzzy QR code" onerror="this.parentNode.style.display='none'"></div>
  </div>
</section>

<script>
  const box = document.getElementById('dots');
  const colors = ['#ffffff','#ff9de2','#7ffff0','#b9a7ff'];
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const s = 3 + Math.random() * 8;
    d.style.width = d.style.height = s + 'px';
    d.style.left = Math.random() * 100 + '%';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.boxShadow = '0 0 ' + (s * 2) + 'px ' + d.style.background;
    d.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    d.style.animationDuration = (8 + Math.random() * 14) + 's';
    d.style.animationDelay = (-Math.random() * 20) + 's';
    box.appendChild(d);
  }
</script>
</body>
</html>
