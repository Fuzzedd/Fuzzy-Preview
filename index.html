<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuzzy</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#fff;
    background:
      radial-gradient(circle at 20% 30%,rgba(255,80,200,.25),transparent 40%),
      radial-gradient(circle at 80% 70%,rgba(0,220,200,.22),transparent 45%),
      linear-gradient(160deg,#12041f 0%,#2b0a52 50%,#4a1a8c 100%);
    overflow-x:hidden;position:relative;
  }
  .stars{position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 10% 20%,#fff8,transparent),
      radial-gradient(3px 3px at 30% 80%,#ff9de288,transparent),
      radial-gradient(2px 2px at 60% 15%,#fff8,transparent),
      radial-gradient(3px 3px at 85% 35%,#7ffff088,transparent),
      radial-gradient(2px 2px at 75% 85%,#fff8,transparent),
      radial-gradient(2px 2px at 45% 55%,#fff6,transparent),
      radial-gradient(3px 3px at 92% 10%,#ff9de288,transparent);}
  header{position:relative;display:flex;align-items:center;padding:24px 32px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:44px;height:44px;object-fit:contain;border-radius:10px}
  .brand span{font-size:30px;font-weight:900;letter-spacing:1px}
  main{position:relative;min-height:calc(100% - 100px);display:flex;flex-direction:column;
    justify-content:center;padding:0 8vw 80px;max-width:900px}
  h1{font-size:clamp(40px,8vw,84px);line-height:.95;font-weight:900;text-transform:uppercase;
    letter-spacing:-1px;margin-bottom:28px}
  h1 em{font-style:normal;background:linear-gradient(90deg,#ff7be5,#6df7e4);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:clamp(17px,2.2vw,22px);line-height:1.5;max-width:560px;color:#eadcff;margin-bottom:40px}
  .btn{display:inline-block;align-self:flex-start;padding:18px 34px;font-size:20px;font-weight:600;
    color:#2b0a52;background:#fff;border-radius:12px;text-decoration:none;
    transition:transform .15s,box-shadow .15s;box-shadow:0 8px 30px rgba(255,123,229,.35)}
  .btn:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(109,247,228,.45)}
</style>
</head>
<body>
<div class="stars"></div>
<header>
  <div class="brand">
    <img src="Fuzzy.png" alt="Fuzzy logo" onerror="this.style.display='none'">
    <span>FUZZY</span>
  </div>
</header>
<main>
  <h1>Welcome to<br><em>Fuzzy</em></h1>
  <p>Fuzzy is a cozy, fun corner of the web made to be explored. Jump in, look around, and see what it's all about.</p>
  <a class="btn" href="https://fuzzedd.github.io/Fuzzy">Open Fuzzy</a>
</main>
</body>
</html>
